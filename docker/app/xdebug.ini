; zz-xdebug.ini — Xdebug se konfigurise ISKLJUCIVO iz okruzenja (FR-60, FR-61).
; PHP-ov ini parser razresava ${VAR} iz environment-a, a FPM master parsira ini
; na startu, kada su promenljive iz .env-a vec u kontejneru. Zato ovde ne postoji
; nijedna podrazumevana vrednost — one zive u .env / .env.example.
; Ovaj fajl NE ucitava ekstenziju; to radi docker-php-ext-enable iz Dockerfile-a,
; a zz- prefiks garantuje da se podesavanja primenjuju posle tog ucitavanja.

; ADR-08: prekidac bez rebuild-a (off / debug / develop,debug).
xdebug.mode = ${XDEBUG_MODE}

; Podrazumevano `default` se ponasa kao TRIGGER mod: bez XDEBUG_TRIGGER-a ili
; XDEBUG_SESSION cookie-ja Xdebug uopste ne pokusava konekciju, pa AC-09 tiho
; pada. Izmereno u talasu 2 kroz xdebug.log_level=10:
;   "Trigger value for 'XDEBUG_SESSION' not found, so not activating".
; FR-61 postavlja XDEBUG_MODE kao prekidac za debug; ako bi uz njega bio
; potreban i trigger, prekidac bi bio trigger, a ne XDEBUG_MODE. Vrednost je
; upisana direktno, ne kroz novu env promenljivu, jer se ugovor 4.4 ne siri.
; Sa XDEBUG_MODE=off direktiva je bez efekta — nema mode-a koji bi se aktivirao,
; pa prekidac iz FR-61 i dalje u potpunosti vraca performanse.
xdebug.start_with_request = yes

; design.md 9.4: Xdebug ne slusa, nego ZOVE IDE. Zato kontejner mora znati adresu
; hosta; ona se razlikuje izmedju Linux/WSL2 i Docker Desktop-a (rizik R-03).
xdebug.client_host = ${XDEBUG_CLIENT_HOST}
xdebug.client_port = ${XDEBUG_CLIENT_PORT}
xdebug.idekey = ${XDEBUG_IDE_KEY}
