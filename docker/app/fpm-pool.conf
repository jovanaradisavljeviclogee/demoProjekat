; zz-pool.conf — override podrazumevanog `www` poola iz zvanicnog PHP-FPM image-a.
; Ucitava se posle zz-docker.conf (glob php-fpm.d/*.conf je sortiran), pa ove
; vrednosti pobedjuju. Novi pool se namerno ne uvodi: dva poola bi se otimala
; oko istog porta 9000.
[www]

; FR-50 / C-07 — worker-i se izvrsavaju kao non-root korisnik iz ugovora 4.1.
user = appuser
group = appuser

; FR-11 + ugovor 4.2 — `web` dolazi sa druge adrese u Compose mrezi, pa pool
; mora prihvatati konekcije na svim interfejsima, ne samo na loopback-u.
listen = 0.0.0.0:9000

; ADR-09 — healthcheck mora dokazati da FPM odgovara na FastCGI protokolu, a ne
; samo da master proces postoji. Ping obradjuje worker, pre izvrsavanja skripte,
; i ne racuna nikakvu statistiku — najjeftiniji dokaz da je pool ziv.
ping.path = /ping
