; zz-app.ini — dev override-i za `app` servis.
; Ucitava se poslednji iz conf.d (zz- prefiks), pa nadjacava ono sto
; docker-php-ext-enable generise za opcache.

; FR-73 / rizik R-06: OPcache ne sme sakriti izmenu PHP fajla. Bez ovoga
; AC-10 pada, i to tako da izgleda kao da bind mount ne radi.
; validate_timestamps je ono sto FR-73 doslovno trazi; revalidate_freq = 0
; uklanja podrazumevani prozor od 2 sekunde, pa se izmena vidi na prvom
; sledecem zahtevu umesto "najkasnije za dve sekunde".
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
