# Apache 2.4 vhost za `web` servis, Debian raspored (ADR-03).
# Odredište u image-u: /etc/apache2/sites-available/000-app.conf
#
# Putanja /var/www/html je namerno identična u `web` i `app` kontejneru.
# Apache FPM-u ne šalje PHP kod nego apsolutnu putanju u SCRIPT_FILENAME, a FPM
# taj fajl otvara sa SVOG fajlsistema (design.md 3.1). Razilaženje putanja znači
# "File not found" na svaki PHP zahtev (rizik R-07).

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Sve izvan public/ je van domašaja HTTP-a: koren projekta nosi .env,
    # vendor/, storage/ i config/. Denied je ujedno zaštita od toga da
    # simbolička veza iz public/ izvede klijenta iz DocumentRoot-a (FR-25).
    <Directory /var/www/html>
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        # FollowSymLinks je uslov da per-directory rewrite ispod uopšte radi.
        # Indexes i MultiViews ostaju isključeni da izlistavanje direktorijuma
        # ne bi otkrivalo sadržaj public/ (FR-25).
        Options FollowSymLinks

        # Pravila front controller-a žive ovde, a ne u public/.htaccess:
        # AllowOverride None znači da Apache ne traži .htaccess pri svakom
        # zahtevu i da je celo ponašanje vhost-a vidljivo na jednom mestu
        # (FR-23, FR-24).
        AllowOverride None
        Require all granted

        # GET / pogađa direktorijum, pa rewrite ispod ne okida; bez eksplicitnog
        # indeksa ishod bi zavisio od Debian dir.conf liste (FR-23).
        DirectoryIndex index.php

        RewriteEngine On
        # Postojeći fajl ili direktorijum Apache servira direktno — statika i
        # Vite izlaz iz public/build nikada ne prolaze kroz FPM (FR-26).
        # Sve ostalo preuzima Laravel front controller (FR-23).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]

        # `web` nema PHP interpreter — zahtev ide FastCGI protokolom na `app`.
        # Adresa je ime Compose servisa, nikada IP (FR-21, C-03, AC-15).
        # Bez putanje iza porta mod_proxy_fcgi šalje r->filename kao
        # SCRIPT_FILENAME, dakle /var/www/html/public/index.php — tačno onu
        # putanju koju FPM nalazi kod sebe (design.md 3.1).
        # Handler je namerno unutar DocumentRoot-a: nijedan .php fajl izvan
        # public/ ne može biti prosleđen FPM-u.
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://app:9000"
        </FilesMatch>
    </Directory>

    # Healthcheck `web` servisa: statički fajl izvan DocumentRoot-a, servira ga
    # Apache bez PHP-a i bez baze. Healthcheck mora meriti ovaj servis, a ne ceo
    # lanac — inače bi greška u aplikaciji obarala zdrav web server (ADR-09,
    # FR-06).
    Alias /healthz /var/www/healthz/index.html
    <Directory /var/www/healthz>
        Require all granted
    </Directory>

    # Logovi idu na stdout/stderr kontejnera da `docker compose logs web` ne bi
    # bio prazna komanda (odluka O-03, podržava FR-81). Healthcheck pogađa
    # /healthz na svakih nekoliko sekundi, pa se izuzima iz access loga — inače
    # bi zatrpao stvaran saobraćaj.
    SetEnvIf Request_URI "^/healthz$" dontlog
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
